name: Verify LabFix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LABFIX_OPERATOR_TOKEN: labfix-ci-disposable-smoke-token
      LABFIX_PORT: 18080
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run evaluate:copilot
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: npm run smoke:production -- http://127.0.0.1:18080/
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
